name: CI

# 为什么需要这个：v0.42.0 之前，README 版本号漂到 v0.25.1、根 package.json 停在 0.23.0、
# origin 落后 5 个提交，全都没有任何自动检查兜底。这里把「能跑测试」和「版本号一致」
# 变成每次 push 的硬门槛，避免再靠人肉记得检查。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（node --test，含版本一致性守卫）
    runs-on: ubuntu-latest
    # 固定 locale：测试里大量中文文件名（持仓.json / 报告.md），避免 runner 默认 locale 造成差异
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 环境自检
        # 每一步都容错：自检是为了看信息，不能让它自己把 job 弄挂
        shell: bash
        run: |
          echo "node: $(node -v 2>&1)"
          echo "npm: $(npm -v 2>&1 || echo 不可用)"
          echo "python3: $(python3 -V 2>&1 || echo 不可用)"
          echo "python: $(command -v python || echo 不存在)"
          echo "node_modules: $([ -d node_modules ] && echo 存在 || echo 不存在)"
          echo "test 文件数: $(ls test | wc -l)"
          ls test || true
      - name: 运行全量测试
        shell: bash
        run: |
          set +e
          # --test-concurrency=1：串行执行，排除并行调度带来的偶发差异；
          # 失败信息同时写入日志与 ::error:: 注解（注解在未登录的 Summary 页即可见）
          node --test --test-reporter=spec --test-concurrency=1 > test-output.log 2>&1
          code=$?
          echo "==== 测试退出码：$code ===="
          tail -30 test-output.log
          if [ "$code" -ne 0 ]; then
            echo "==== 失败要点（下方 Annotations 可直接看）===="
            grep -nE '✖|not ok|Error|ERR_[A-Z_]+|Cannot find|AssertionError|ENOENT|EACCES' test-output.log \
              | head -12 \
              | while IFS= read -r line; do
                  msg=$(printf '%s' "$line" | sed 's/::/:/g' | cut -c1-350)
                  echo "::error::${msg}"
                done
          fi
          exit $code
      - name: 失败时保留完整日志（可下载）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 7

  web:
    name: 前端构建（tsc --noEmit + vite build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装前端依赖（仅 typescript + vite，均来自公共 npm）
        run: npm --prefix web install --no-audit --no-fund
      - name: 构建（产物落到临时目录，不污染仓库）
        env:
          DSH_INVEST_BASE_DIR: ${{ runner.temp }}/dsh-invest-base
        run: |
          mkdir -p "$DSH_INVEST_BASE_DIR"
          npm --prefix web run build
      - name: 校验构建产物存在
        env:
          DSH_INVEST_BASE_DIR: ${{ runner.temp }}/dsh-invest-base
        run: |
          test -f "$DSH_INVEST_BASE_DIR/.dsh-invest/web/dist/index.html"
          test -f "$DSH_INVEST_BASE_DIR/.dsh-invest/web/dist/workbench.js"
          test -f "$DSH_INVEST_BASE_DIR/.dsh-invest/web/dist/workbench.css"
          du -sh "$DSH_INVEST_BASE_DIR/.dsh-invest/web/dist"
