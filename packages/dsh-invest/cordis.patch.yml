# dsh-invest bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
#   dsh plugin --profile web add link:<path-to-this-package>
# (or add the package to the profile package.json dependencies + pnpm install).
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (invest_run tool, /api/dsh-invest routes, agent
# guidance section), and the `dsh.client` declaration in package.json makes
# the browser half (exports "./client") load in the web GUI.
- insert:
    - id: invest
      name: 'dsh-invest'
